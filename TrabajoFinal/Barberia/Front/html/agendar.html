<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita</title>
    <link rel="stylesheet" href="../css/agendaStyles.css">
    <script type="module" src="../agendar.js" defer></script>
</head>
<body>
    <header>
        <h1>Agendar Cita</h1>
        <nav>
            <a href="index.html">Inicio</a>
        </nav>
    </header>
    <main>
        <form id="agendar-form">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            
            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" required>
            
            <label for="date">Fecha:</label>
            <input type="date" id="date" required>
            <label for="time">Hora:</label>
            <input type="time" id="time" required>

            <label for="barbero">Barbero:</label>
            <select id="barbero" required>
                <option value="barbero1" data-horarios="9:00-12:00,14:00-18:00">Barbero 1</option>
                <option value="barbero2" data-horarios="10:00-13:00,15:00-19:00">Barbero 2</option>
                <option value="barbero3" data-horarios="8:00-11:00,13:00-17:00">Barbero 3</option>
            </select>
            
            
            <button type="submit">Confirmar Cita</button>
        </form>
    </main>
</body>
</html>
